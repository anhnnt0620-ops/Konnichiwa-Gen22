name: Deploy JPC Web Game

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript Syntax
        run: |
          for file in server.js firebase.js js/*.js scripts/*.js; do
            node -c "$file"
          done

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static bundle
        run: |
          mkdir -p _site
          cp index.html firebase.js _site/
          cp -r css js Font Image _site/
          rm -rf "_site/Image/Kokeshi 5 Ban/backup_original_6000px"
          if [ -d Video ]; then cp -r Video _site/; fi
          node scripts/seal-env.js _site/env-config.js

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
